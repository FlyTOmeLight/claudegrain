name: Release

# Path A: ad-hoc signed release (no Apple Developer Program needed).
# Users will see a Gatekeeper warning on first launch — see README for the
# right-click → Open workaround. When ready to upgrade to a notarized release,
# follow docs/RELEASE.md path B.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-15 ships Xcode 16+ which can read xcodegen's default
    # objectVersion = 77. macos-14's Xcode 15.4 cannot.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      BUNDLE_ID: dev.claudegrain.menubar
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install build deps
        # xcodegen regenerates Claudegrain.xcodeproj from project.yml at every
        # build, keeping CI honest about what's committed. create-dmg gives
        # us the polished DMG layout; hdiutil is a fallback.
        run: brew install create-dmg xcodegen

      - name: Build DMG (ad-hoc signed)
        # build-dmg.sh now drives xcodebuild so the embedded
        # ClaudegrainWidget.appex ships inside .app. DEVELOPMENT_TEAM is
        # intentionally unset on the ad-hoc CI path — the App Group
        # entitlement won't validate at runtime, but the menu-bar app
        # itself works fine.
        run: ./scripts/build-dmg.sh

      - name: Compute artifact path
        id: artifact
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DMG="dist/claudegrain-${VERSION}.dmg"
          test -f "$DMG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: claudegrain-${{ steps.artifact.outputs.version }}-dmg
          path: ${{ steps.artifact.outputs.dmg }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.dmg }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## First launch (ad-hoc signed build)

            macOS Gatekeeper will block the app on first open because we
            haven't paid for an Apple Developer ID yet. To run:

            1. Drag **claudegrain.app** into `/Applications/`
            2. Right-click the app → **Open** → confirm
            3. Subsequent launches open normally

            Or via Terminal:
            ```sh
            xattr -dr com.apple.quarantine /Applications/claudegrain.app
            open /Applications/claudegrain.app
            ```

            When the project upgrades to a notarized release, this hoop will
            disappear.

      - name: Bump Homebrew tap
        # Skips silently when HOMEBREW_TAP_TOKEN isn't configured (e.g. for
        # PRs from forks). Setup once: create a fine-grained PAT scoped to
        # FlyTOmeLight/homebrew-claudegrain with contents:write, store as
        # the HOMEBREW_TAP_TOKEN repo secret. All inputs to `run:` are from
        # repo-controlled paths (VERSION file via earlier step, computed
        # SHA, repo secret) — no github.event.* user-controlled strings.
        if: startsWith(github.ref, 'refs/tags/v') && env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.artifact.outputs.version }}
          DMG: ${{ steps.artifact.outputs.dmg }}
        run: |
          set -euo pipefail
          SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          WORK="$(mktemp -d)"
          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/FlyTOmeLight/homebrew-claudegrain.git" \
            "$WORK/tap"
          cd "$WORK/tap"
          # macos-15 runner uses BSD sed — `-i ''` two-arg form, not GNU `-i`.
          sed -i '' -E "s/version \"[^\"]*\"/version \"${VERSION}\"/" Casks/claudegrain.rb
          sed -i '' -E "s/sha256 \"[^\"]*\"/sha256 \"${SHA}\"/" Casks/claudegrain.rb
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          if git diff --quiet Casks/claudegrain.rb; then
            echo "tap already at $VERSION — nothing to push"
            exit 0
          fi
          git add Casks/claudegrain.rb
          git commit -m "claudegrain ${VERSION}"
          git push origin HEAD:main
